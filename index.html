<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CollabBoard</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      @layer base {
        html, body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed-variant": "#3b4663",
              "error": "#ba1a1a",
              "on-tertiary-fixed-variant": "#653e00",
              "on-tertiary-container": "#ffffff",
              "on-primary-fixed-variant": "#0040a0",
              "tertiary-fixed-dim": "#ffb95f",
              "on-surface-variant": "#424654",
              "surface-tint": "#0056d0",
              "error-container": "#ffdad6",
              "tertiary-fixed": "#ffddb8",
              "inverse-primary": "#b1c5ff",
              "surface-container": "#eceef0",
              "surface-container-lowest": "#ffffff",
              "primary": "#0055ce",
              "tertiary-container": "#a66900",
              "on-secondary": "#ffffff",
              "tertiary": "#845300",
              "primary-container": "#2f6fed",
              "primary-fixed-dim": "#b1c5ff",
              "secondary": "#535e7c",
              "on-primary-fixed": "#001847",
              "surface-container-high": "#e6e8ea",
              "outline-variant": "#c2c6d7",
              "on-secondary-container": "#545e7d",
              "on-tertiary": "#ffffff",
              "secondary-fixed-dim": "#bbc6e9",
              "inverse-surface": "#2d3133",
              "outline": "#737786",
              "on-error": "#ffffff",
              "on-error-container": "#93000a",
              "on-tertiary-fixed": "#2a1700",
              "surface-container-highest": "#e0e3e5",
              "surface": "#f7f9fb",
              "inverse-on-surface": "#eff1f3",
              "surface-dim": "#d8dadc",
              "on-primary-container": "#ffffff",
              "secondary-container": "#cfd9fd",
              "on-surface": "#191c1e",
              "primary-fixed": "#dae2ff",
              "background": "#f7f9fb",
              "surface-variant": "#e0e3e5",
              "surface-bright": "#f7f9fb",
              "secondary-fixed": "#dae2ff",
              "surface-container-low": "#f2f4f6",
              "on-background": "#191c1e",
              "on-primary": "#ffffff",
              "on-secondary-fixed": "#0f1b35"
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            spacing: {
              "gutter": "16px",
              "lg": "24px",
              "xs": "4px",
              "base": "4px",
              "xl": "32px",
              "md": "16px",
              "sm": "8px",
              "margin-desktop": "32px",
              "margin-mobile": "16px"
            },
            fontFamily: {
              "label-sm": ["Inter"],
              "body-md": ["Inter"],
              "headline-lg-mobile": ["Inter"],
              "label-md": ["Inter"],
              "headline-md": ["Inter"],
              "body-lg": ["Inter"],
              "headline-sm": ["Inter"],
              "headline-lg": ["Inter"]
            },
            fontSize: {
              "label-sm": ["11px", { lineHeight: "14px", fontWeight: "600" }],
              "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
              "headline-lg-mobile": ["24px", { lineHeight: "30px", fontWeight: "600" }],
              "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500" }],
              "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }],
              "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }],
              "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" }]
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-background font-body-md text-on-surface">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
